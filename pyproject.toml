[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mini-cdn"
version = "0.1.0"
description = "A local-first CDN lab with FastAPI, HAProxy, and Redis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "redis>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "fakeredis>=2.28,<3",
  "hatchling>=1.27,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["mini_cdn"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
